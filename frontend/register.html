<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration | PLASU SUG Voting System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <style>

        body {
            background: #f4f6f8;
        }

        .register-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        .logo {
            width: 75px;
            height: 75px;
            object-fit: contain;
        }

        .title {
            color: #198754;
            font-weight: bold;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control,
        .form-select {
            padding: 12px;
            border-radius: 8px;
        }

        .btn-register {
            padding: 12px;
            font-weight: bold;
        }

        #message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

    </style>

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9">

            <!-- HEADER -->

            <div class="text-center mb-4">

                <img
                    src="images/plasu-logo.png"
                    class="logo me-2"
                    alt="PLASU Logo">

                <img
                    src="images/sug-logo.png"
                    class="logo"
                    alt="SUG Logo">

                <h2 class="title mt-3">
                    Student Registration
                </h2>

                <p class="text-muted">
                    PLASU Student Union Government Online Voting System
                </p>

            </div>


            <!-- REGISTRATION CARD -->

            <div class="card register-card p-4 p-md-5">

                <div id="message"></div>


                <form id="registerForm">

                    <!-- FULL NAME -->

                    <div class="mb-3">

                        <label
                            for="fullname"
                            class="form-label">

                            Full Name

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="fullname"
                            placeholder="Enter your full name"
                            required>

                    </div>


                    <!-- MATRIC NUMBER -->

         <div class="mb-3">

    <label
        for="matric_no"
        class="form-label">

        Matric Number

    </label>

    <input
        type="text"
        class="form-control"
        id="matric_no"
        placeholder="PLASU/CSC/2024/001"
        pattern="PLASU/[A-Z]{2,5}/[0-9]{4}/[0-9]{3}"
        title="Format: PLASU/CSC/2024/001"
        style="text-transform: uppercase;"
        required>

    <small class="text-muted">
        Format: PLASU/CSC/2024/001
    </small>

</div>


                    <!-- DEPARTMENT -->

                    <div class="mb-3">

                        <label
                            for="department"
                            class="form-label">

                            Department

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="department"
                            placeholder="Enter your department"
                            required>

                    </div>


                    <!-- FACULTY -->

                    <div class="mb-3">

                        <label
                            for="faculty"
                            class="form-label">

                            Faculty

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="faculty"
                            placeholder="Enter your faculty"
                            required>

                    </div>


                    <!-- LEVEL -->

                    <div class="mb-3">

                        <label
                            for="level"
                            class="form-label">

                            Level

                        </label>

                        <select
                            id="level"
                            class="form-select"
                            required>

                            <option value="">
                                Select Level
                            </option>

                            <option value="100 Level">
                                100 Level
                            </option>

                            <option value="200 Level">
                                200 Level
                            </option>

                            <option value="300 Level">
                                300 Level
                            </option>

                            <option value="400 Level">
                                400 Level
                            </option>

                            <option value="500 Level">
                                500 Level
                            </option>

                        </select>

                    </div>


                    <!-- PASSWORD -->

                    <div class="mb-3">

                        <label
                            for="password"
                            class="form-label">

                            Password

                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Create a password"
                            minlength="4"
                            required>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="mb-4">

                        <label
                            for="confirmPassword"
                            class="form-label">

                            Confirm Password

                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            minlength="4"
                            required>

                    </div>


                    <!-- REGISTER BUTTON -->

                    <button
                        type="submit"
                        id="registerButton"
                        class="btn btn-success btn-register w-100">

                        Create Student Account

                    </button>

                </form>


                <hr class="my-4">


                <!-- LOGIN LINK -->

                <div class="text-center">

                    <p class="mb-2">
                        Already have a student account?
                    </p>

                    <a
                        href="login.html"
                        class="btn btn-outline-success">

                        Student Login

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="js/register.js"></script>

</body>

</html>
