<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Students - PLASU SUG</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<div class="container-fluid">

    <div class="row">


        <!-- ================= SIDEBAR ================= -->

        <div class="col-md-3 col-lg-2 sidebar">

            <h3 class="text-white text-center mb-4">
                PLASU SUG
            </h3>

            <a href="admin-dashboard.html">
                🏠 Dashboard
            </a>

            <a href="manage-students.html">
                👥 Manage Students
            </a>

            <a href="manage-candidates.html">
                🗳 Manage Candidates
            </a>

            <a href="election-results.html">
                📊 Election Results
            </a>

            <a href="#">
                ⚙ Election Settings
            </a>

            <a href="index.html">
                🚪 Logout
            </a>

        </div>


        <!-- ================= MAIN CONTENT ================= -->

        <div class="col-md-9 col-lg-10 p-4">

            <h2 class="text-success mb-4">
                Manage Students
            </h2>


            <!-- ================= STATISTICS ================= -->

            <div class="row mb-4">


                <div class="col-md-4 mb-3">

                    <div class="card info-card text-center p-3">

                        <h6>
                            Total Students
                        </h6>

                        <h2 id="totalStudents">
                            0
                        </h2>

                    </div>

                </div>


                <div class="col-md-4 mb-3">

                    <div class="card info-card text-center p-3">

                        <h6>
                            Students Who Voted
                        </h6>

                        <h2 id="votedStudents">
                            0
                        </h2>

                    </div>

                </div>


                <div class="col-md-4 mb-3">

                    <div class="card info-card text-center p-3">

                        <h6>
                            Yet To Vote
                        </h6>

                        <h2 id="remainingStudents">
                            0
                        </h2>

                    </div>

                </div>

            </div>


            <!-- ================= SEARCH ================= -->

            <div class="card p-4 mb-4">

                <label
                    for="searchInput"
                    class="form-label fw-bold"
                >
                    Search Student
                </label>

                <input
                    type="text"
                    id="searchInput"
                    class="form-control"
                    placeholder="Search by name or matric number..."
                >

            </div>


            <!-- ================= STUDENT TABLE ================= -->

            <div class="card p-4">

                <div class="table-responsive">

                    <table
                        class="table table-bordered table-hover align-middle"
                    >

                        <thead class="table-success">

                            <tr>

                                <th>#</th>

                                <th>Full Name</th>

                                <th>Matric Number</th>

                                <th>Department</th>

                                <th>Faculty</th>

                                <th>Level</th>

                                <th>Voting Status</th>

                            </tr>

                        </thead>

                        <tbody id="studentsTable">

                            <tr>

                                <td
                                    colspan="7"
                                    class="text-center"
                                >
                                    Loading students...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="js/manage-students.js"></script>

</body>

</html>
