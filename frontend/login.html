<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login | PLASU SUG Voting System</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <!-- HEADER -->

            <div class="header-card text-center">

                <img
                    src="images/plasu-logo.png"
                    class="logo me-3">

                <img
                    src="images/sug-logo.png"
                    class="logo">

                <h2 class="mt-3 title">
                    Student Login
                </h2>

                <p class="subtitle">
                    Student Union Government Online Voting System
                </p>

            </div>

            <!-- LOGIN CARD -->

            <div class="card p-4">

                <form id="loginForm">

                    <!-- MATRIC NUMBER -->

                    <div class="mb-3">

                        <label class="form-label">
                            Matric Number
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="matric"
                            placeholder="PLASU/CSC/24/001"
                            required>

                    </div>

                    <!-- PASSWORD -->

                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <div class="input-group">

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                placeholder="Enter Password"
                                required>

                            <button
                                class="btn btn-outline-secondary"
                                type="button"
                                onclick="togglePassword()">

                                👁

                            </button>

                        </div>

                    </div>

                    <!-- REMEMBER ME -->

                    <div class="form-check mb-4">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="remember">

                        <label class="form-check-label">

                            Remember Me

                        </label>

                    </div>

                    <!-- LOGIN -->

                    <button
                        type="submit"
                        class="btn btn-success w-100">

                        Login

                    </button>

                </form>

                <hr>

                <!-- REGISTRATION -->

                <div class="text-center mb-3">

                    <p class="mb-2">
                        Don't have a student account?
                    </p>

                    <a
                        href="register.html"
                        class="btn btn-primary w-100">

                        Register as a Student

                    </a>

                </div>

                <!-- BACK HOME -->

                <div class="text-center">

                    <a
                        href="index.html"
                        class="btn btn-warning">

                        ← Back to Home

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="js/login.js"></script>

</body>

</html>
