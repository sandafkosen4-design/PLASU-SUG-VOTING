<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLASU SUG Voting Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f7fa;
        }

        .header{
            background:#198754;
            color:white;
            padding:20px;
            border-radius:10px;
            margin-bottom:20px;
        }

        .student-card{
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 2px 10px rgba(0,0,0,.1);
            margin-bottom:20px;
        }

        .position-section{
            background:white;
            padding:20px;
            border-radius:10px;
            margin-bottom:25px;
            box-shadow:0 2px 8px rgba(0,0,0,.08);
        }

        .candidate-card{
            border:1px solid #ddd;
            border-radius:8px;
            padding:15px;
            margin-bottom:15px;
            transition:.3s;
        }

        .candidate-card:hover{
            border-color:#198754;
            background:#f8fff9;
        }

        .candidate-card h5{
            color:#198754;
            font-weight:bold;
        }

        .progress{
            height:25px;
        }

        #progressBar{
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container py-4">

    <div class="header text-center">
        <h2>PLATEAU STATE UNIVERSITY</h2>
        <h4>Student Union Government Online Voting</h4>
    </div>

    <div class="student-card">

        <h4>Student Information</h4>
        <hr>

        <div class="row">

            <div class="col-md-6">
                <strong>Name:</strong>
                <span id="studentName"></span>
            </div>

            <div class="col-md-6">
                <strong>Matric No:</strong>
                <span id="matricNo"></span>
            </div>

            <div class="col-md-6 mt-3">
                <strong>Department:</strong>
                <span id="department"></span>
            </div>

            <div class="col-md-6 mt-3">
                <strong>Level:</strong>
                <span id="level"></span>
            </div>

        </div>

    </div>

    <div class="card mb-4">

        <div class="card-body">

            <h5>Voting Progress</h5>

            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar bg-success"
                    style="width:0%">
                    0%
                </div>

            </div>

            <p class="mt-2" id="progressText">
                0 of 0 Positions Completed
            </p>

        </div>

    </div>

    <form id="voteForm">

        <!-- Dynamic candidates -->
        <div id="candidateContainer"></div>

        <div class="form-check mb-4">

            <input
                class="form-check-input"
                type="checkbox"
                id="confirmVote">

            <label
                class="form-check-label"
                for="confirmVote">

                I confirm that I have selected my preferred candidates and understand that my vote cannot be changed after submission.

            </label>

        </div>

        <div class="text-center">

            <button
                type="submit"
                class="btn btn-success btn-lg px-5">

                Submit Vote

            </button>

        </div>

    </form>

</div>

<script src="js/vote.js"></script>

</body>
</html>
